services:
  mongo:
    image: mongo:8
    container_name: wyxan-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - wyxan-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  wyxan-mongo-data:
